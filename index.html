<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>ExpertFR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--compta:#92400E;--client:#166534;--client-bg:#E3F4EA;--micro:#D92D20;--micro-bg:#FEF3F2;--ia:#6941C6;--ia-bg:#EEE8FB;--navy:#1B2A41;--gold:#C8A96E;--bg:#F5F6F8;--card:#fff;--line:#DDE2E8;--txt:#1B2A41;--muted:#6B7A8D;--ok:#15803d;--warn:#b45309;--err:#991b1b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px calc(10px) 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:4px 6px}
#sync{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;border:0;white-space:nowrap}
#sync.pending{background:var(--gold);color:var(--navy)}
#sync.err{background:#fee2e2;color:var(--err)}
main{padding:12px 14px 110px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font:inherit;font-size:12px;color:var(--muted);position:relative}
nav button b{display:block;font-size:22px;font-weight:normal}
nav button.on{color:var(--client);font-weight:700}
nav button[data-go="cheques"].on{color:var(--compta)}
#scan{position:fixed;inset:0;z-index:30;background:#111827;color:#fff;display:flex;flex-direction:column}
#scan .scan-haut{padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;flex-direction:column;gap:2px}
#scan .scan-haut span{font-size:13px;color:#D1D5DB}
#scan .scan-zone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#scan canvas{touch-action:none;max-width:100%;max-height:100%}
#scan img{max-width:100%;max-height:100%;background:#fff}
#scan .scan-bas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
#scan .scan-bas .btn{margin:0}
.trois{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trois .btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:24px;padding:10px 4px}
.trois .btn span{font-size:13px}
.doute label{color:#93370D;font-weight:700}
.doute input,.doute textarea,.doute select{border:2px solid #F79009;background:#FFFAEB}
.c-client{margin-top:6px}
nav button.micro{color:var(--micro);font-weight:700;padding-top:0}
nav button.micro b{width:64px;height:64px;margin:-26px auto 2px;border-radius:50%;background:var(--micro);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;border:4px solid #fff;box-shadow:0 4px 12px rgba(217,45,32,.35)}
nav button.micro.rec b{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(217,45,32,.18)}}
#volet{position:fixed;inset:0;z-index:20;background:rgba(27,42,65,.45);display:flex;align-items:flex-end}
#volet[hidden]{display:none}
#volet .sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#volet .poignee{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
#volet h2{font-size:18px;margin:4px 0}
.choix{font:inherit;text-align:left;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);width:100%}
.choix .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.choix .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.choix .tx span{font-size:13px;color:var(--muted)}
.choix.fort{border:2px solid var(--micro);background:var(--micro-bg)}
.choix.fort .ic{border-radius:50%;background:var(--micro);color:#fff;width:52px;height:52px;font-size:24px}
.choix.cli .ic{background:var(--client-bg)}
.choix.ia .ic{background:var(--ia-bg)}
.annuler{font:inherit;padding:12px;border:0;background:none;color:var(--muted)}
.bandeau-choix{background:var(--micro-bg);border:1px solid #FECDCA;color:#912018;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bandeau-choix span{flex:1}
.bandeau-choix button{background:none;border:0;color:#912018;font:inherit;text-decoration:underline}
.lien-reg{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--navy);text-decoration:none;font:inherit;width:100%;text-align:left}
.lien-reg .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.lien-reg span.t{flex:1;font-weight:600}
.lien-reg .badge.alerte{background:#c0262d;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:70px}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:600;margin-top:10px;text-align:center;text-decoration:none}
.btn.light{background:#fff;color:var(--navy)}
.btn.danger{background:#fff;color:var(--err);border-color:#f3c4c4}
.search{position:sticky;top:58px;z-index:4;background:var(--bg);padding-bottom:8px}
.cl{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cl .n{font-weight:600}.cl .s{font-size:13px;color:var(--muted)}
.cl>div:first-child{flex:1;min-width:0}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;white-space:nowrap;background:#EFF2F6;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:-12px -14px 12px;padding:10px 14px;position:sticky;top:52px;z-index:4;background:var(--bg)}
.tabs button{flex:1;padding:9px 2px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;white-space:nowrap;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs button[data-t="dictee"]{color:var(--micro);font-weight:700;border-color:#FECDCA}
.tabs button[data-t="dictee"].on{background:var(--micro);color:#fff;border-color:var(--micro)}
.total{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.total.big{font-size:20px;font-weight:700;border:0;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 10px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.exps{margin:0 0 10px}
.bar{height:10px;background:#E6EAF0;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gold)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;padding:12px;background:#EFF2F6;color:var(--navy);font-weight:600;display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary span:first-child{flex:1}
.it{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.it .t{flex:1}
.it .box{width:24px;height:24px;border:2px solid var(--navy);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.it.done .box{background:var(--ok);border-color:var(--ok)}
.it.done .t{color:var(--muted);text-decoration:line-through}
.it.na .t{color:#aab3bf;text-decoration:line-through}
.it.na .box{border-color:#cfd6df}
.it .x{background:none;border:0;color:#9aa5b1;font-size:18px;padding:0 4px}
.warn{color:var(--warn);font-size:13px;margin-top:6px}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.rec{text-align:center}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 14px 16px}
.rec .temps{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);margin:0}
.rec .etat{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.rec.on .etat{color:#B42318}
.rec .row{width:100%}
.rec .btn{margin-top:0}
.gros-micro{width:132px;height:132px;border-radius:50%;border:8px solid #FECDCA;background:var(--micro);color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(217,45,32,.35);padding:0}
.gros-micro .carre{width:40px;height:40px;border-radius:7px;background:#fff;display:block}
.rec.on .gros-micro{animation:pulse 1.4s infinite}
.voyants{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;text-align:center}
.voyants div{padding:6px 2px;border-radius:8px;background:#EFF2F6;color:#5B6878}
.voyants .vert{background:#E3F4EA;color:#166534;font-weight:600}
.voyants .orange{background:#FEF0C7;color:#93370D;font-weight:600}
.bulle{padding:10px 12px;border-radius:14px;margin-bottom:8px;max-width:92%}
.bulle.moi{background:var(--navy);color:#fff;margin-left:auto;white-space:pre-wrap}
.bulle.ia{background:#fff;border:1px solid var(--line)}
.bulle.ia h3{font-size:16px}
.btn.rouge{background:#c0262d;border-color:#c0262d}
#barre-rec{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));border-radius:12px;margin:0 12px;background:#c0262d;color:#fff;text-align:center;padding:8px;font-size:14px;z-index:6}
.dic{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.dic audio{width:100%}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vig{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#E6EAF0}
.vig img{width:100%;height:100%;object-fit:cover;display:block}
.vig .badge{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9)}
.vig .x{position:absolute;right:2px;top:2px;background:rgba(255,255,255,.9);border-radius:12px;color:var(--err)}
label.btn{cursor:pointer;display:flex;align-items:center;justify-content:center}
.pastille{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#c0262d;color:#fff;font-size:11px;font-weight:700;line-height:18px}
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Retour">‹</button>
  <h1 id="title">ExpertFR</h1>
  <button id="sync" type="button">…</button>
</header>
<main id="main"></main>
<nav>
  <button data-go="clients" class="on"><b>👥</b>Clients<span class="pastille" id="pastille-demandes" hidden></span></button>
  <button data-go="nouveau"><b>➕</b>Nouveau</button>
  <button data-go="micro" class="micro" id="nav-micro"><b>🎤</b>Micro</button>
  <button data-go="cheques"><b>💶</b>Chèques</button>
  <button data-go="reglages"><b>⚙️</b>Réglages<span class="pastille" hidden></span></button>
</nav>
<div id="volet" hidden></div>
<div class="toast" id="toast"></div>
<div id="barre-rec" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="dictee.js"></script>
<script src="photos.js"></script>
<script src="site.js"></script>
<script src="micro.js"></script>
<script src="scanner.js"></script>
<script src="cheques.js"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="window.gisPret=true"></script>
</body>
</html>
